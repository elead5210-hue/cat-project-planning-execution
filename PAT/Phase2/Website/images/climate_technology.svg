<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Technology helping the climate</title>
  <desc id="desc">A sun shines over green hills with a solar panel, a wind turbine and a green leaf, showing technology working together with nature.</desc>

  <!-- Sky -->
  <rect width="640" height="360" fill="#cdeefd"/>

  <!-- Sun and rays -->
  <circle cx="90" cy="80" r="35" fill="#ffd23f"/>
  <g stroke="#ffb703" stroke-width="6" stroke-linecap="round">
    <line x1="135" y1="80" x2="152" y2="80"/>
    <line x1="121.8" y1="111.8" x2="133.8" y2="123.8"/>
    <line x1="90" y1="125" x2="90" y2="142"/>
    <line x1="58.2" y1="111.8" x2="46.2" y2="123.8"/>
    <line x1="45" y1="80" x2="28" y2="80"/>
    <line x1="58.2" y1="48.2" x2="46.2" y2="36.2"/>
    <line x1="90" y1="35" x2="90" y2="18"/>
    <line x1="121.8" y1="48.2" x2="133.8" y2="36.2"/>
  </g>

  <!-- Clouds -->
  <g fill="#ffffff">
    <ellipse cx="320" cy="70" rx="45" ry="16"/>
    <ellipse cx="345" cy="58" rx="28" ry="14"/>
    <ellipse cx="540" cy="100" rx="38" ry="13"/>
    <ellipse cx="560" cy="90" rx="22" ry="11"/>
  </g>

  <!-- Hills and ground -->
  <path d="M0,300 C120,270 220,290 340,285 C460,280 560,265 640,285 L640,360 L0,360 Z" fill="#6cc24a"/>
  <path d="M0,330 C140,310 260,335 400,325 C500,318 580,325 640,320 L640,360 L0,360 Z" fill="#4fa83d"/>

  <!-- Solar panel -->
  <g>
    <line x1="170" y1="272" x2="170" y2="305" stroke="#555555" stroke-width="5"/>
    <line x1="225" y1="255" x2="225" y2="305" stroke="#555555" stroke-width="5"/>
    <polygon points="110,250 230,215 260,255 140,290" fill="#1d3f8a" stroke="#dfe9ff" stroke-width="3"/>
    <g stroke="#dfe9ff" stroke-width="2">
      <line x1="150" y1="238.3" x2="180" y2="276.7"/>
      <line x1="190" y1="226.7" x2="220" y2="265.3"/>
      <line x1="125" y1="270" x2="245" y2="235"/>
    </g>
  </g>

  <!-- Wind turbine -->
  <g>
    <polygon points="466,300 474,300 472,130 468,130" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1"/>
    <g fill="#ffffff" stroke="#9a9a9a" stroke-width="1">
      <polygon points="467,128 470,50 473,128"/>
      <polygon points="467,128 470,50 473,128" transform="rotate(120 470 130)"/>
      <polygon points="467,128 470,50 473,128" transform="rotate(240 470 130)"/>
    </g>
    <circle cx="470" cy="130" r="7" fill="#d9d9d9" stroke="#9a9a9a" stroke-width="1"/>
  </g>

  <!-- Leaf -->
  <g>
    <path d="M560,300 C540,260 570,225 610,220 C615,260 595,295 560,300 Z" fill="#2e9e44" stroke="#1f7a33" stroke-width="2"/>
    <path d="M560,300 L600,235" fill="none" stroke="#1f7a33" stroke-width="2"/>
  </g>
</svg>